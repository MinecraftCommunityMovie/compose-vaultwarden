services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine
    container_name: vaultwarden
    restart: unless-stopped
    secrets:
      - vaultwarden_admin
      - smtp_password
    environment:
      - DOMAIN=https://vaultwarden.projectbeacon.world
      - SIGNUPS_ALLOWED=false
      - SIGNUPS_VERIFY=true
      - SIGNUPS_DOMAINS_WHITELIST=projectbeacon.world
      - INVITATIONS_ALLOWED=false
      - PASSWORD_HINTS_ALLOWED=false
      - SHOW_PASSWORD_HINT=false
      - ADMIN_TOKEN_FILE=/run/secrets/vaultwarden_admin
      - DNS_PREFER_IPV6=true

      # SMTP setup
      - SMTP_HOST=mail.projectbeacon.world
      - SMTP_FROM=noreply@projectbeacon.world
      - SMTP_FROM_NAME=Vaultwarden
      - SMTP_USERNAME=noreply@projectbeacon.world
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - SMTP_TIMEOUT=15
      - SMTP_SECURITY=starttls
      - SMTP_PORT=587
    volumes:
      - /opt/docker-data/vaultwarden/:/data/
    ports:
      - 127.0.0.1:8800:80

secrets:
  vaultwarden_admin:
    file: /opt/docker-secrets/vaultwarden_admin
  smtp_password:
    file: /opt/docker-secrets/smtp_password
